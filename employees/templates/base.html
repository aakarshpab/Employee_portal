<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Employee Portal{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; }
        nav { background: #333; padding: 12px; border-radius: 6px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; max-width: 400px; background: #fafafa; }
    </style>
</head>
<body>
    
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'employee_list' %}">Employee List</a>
        <a href="{% url 'about' %}">About</a>
    </nav>
    <hr>
    
    <div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
